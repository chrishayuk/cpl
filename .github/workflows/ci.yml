name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (native; the examples and every program in the tutorial)
        run: cargo test

      - name: Test (WASI, inside wasmtime)
        run: cargo test --target wasm32-wasip1

      - name: Native and WASI builds print the same thing
        run: scripts/wasi-check.sh

      - name: Browser playground (the WASI host, in node)
        run: |
          node web/build.mjs
          node web/test.mjs
